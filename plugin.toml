id = "brunornasc.kafka"
name = "Kafka"
version = "0.1.0"
description = "Explore Apache Kafka clusters from OpenIDEA: connections, topics, partitions, brokers, consumer groups, live message consumption and publishing."
authors = ["Bruno Rodrigues <brunornasc@gmail.com>"]
license = "Apache-2.0"
change-notes = "0.1.0 — first release: connection profiles, Apache Kafka CLI download/install, topics, partitions, brokers, consumer groups, message consumption and publishing."
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.15"
wasm = "dist/plugin.wasm"
activation = [
  "on-command:*",
  "on-view:explorer",
  "on-view:topics",
  "on-view:messages",
  "on-view:connections",
  "on-view:brokers",
  "on-view:groups",
  "on-view:install",
  "on-view:log",
  "on-schedule:60",
]

# The WASM sandbox has no TCP sockets: Kafka operations run through the
# Apache Kafka distribution scripts (`process:<program>`, the file the user
# approved). curl/tar install that distribution into plugin-dir.
# All user-facing text is English; locales/pt-BR.json is translated by the IDE.
[capabilities]
required = [
  "project.read",
  "storage",
  "events",
  "process:curl",
  "process:tar",
  "process:java",
]
optional = [
  "process:kafka-topics.sh",
  "process:kafka-console-consumer.sh",
  "process:kafka-console-producer.sh",
  "process:kafka-consumer-groups.sh",
  "process:kafka-get-offsets.sh",
  "process:kafka-broker-api-versions.sh",
  "process:kafka-metadata-quorum.sh",
  "process:kafka-run-class.sh",
  "process:kcat",
  "net:downloads.apache.org",
  "net:archive.apache.org",
  "clipboard",
  "fs.read:~",
]

